name: Supabase keep-alive

# Free-tier Supabase projects pause after 7 days without activity.
# This pings the REST API twice a week so that doesn't happen.
on:
  schedule:
    - cron: "0 14 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the programs table
        run: |
          curl --fail --silent --show-error \
            "https://blrvxncjptaqmgikqzkx.supabase.co/rest/v1/programs?select=id&limit=1" \
            -H "apikey: sb_publishable_HLfViVp2yb-h5vNLThzOGA_dIBJbdjo" \
            -H "Authorization: Bearer sb_publishable_HLfViVp2yb-h5vNLThzOGA_dIBJbdjo"

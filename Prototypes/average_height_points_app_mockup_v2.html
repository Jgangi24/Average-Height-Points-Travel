<style>
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ph{max-width:380px;margin:0 auto;background:var(--surface-2);border:0.5px solid var(--border-strong);border-radius:28px;overflow:hidden}
.bk{display:inline-flex;align-items:center;gap:4px;color:var(--text-accent);font-size:15px;cursor:pointer;padding:4px 0}
.tap{cursor:pointer}
.tap:focus-visible,.bk:focus-visible,.tb:focus-visible{outline:2px solid var(--border-accent);outline-offset:-2px}
.rw{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:0.5px solid var(--border)}
.rw.tap:active,.tc:active{background:var(--surface-1)}
.sm{font-size:13px;color:var(--text-secondary);line-height:1.5}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden}
.bar>span{display:block;height:100%}
.chip{display:inline-block;font-size:12px;padding:3px 8px;border-radius:var(--radius);margin:0 6px 6px 0}
.tabs{display:flex;border-top:0.5px solid var(--border);background:var(--surface-2)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 14px;font-size:12px;color:var(--text-secondary);cursor:pointer}
.tb.on{color:var(--text-accent)}
.tc{margin:0 16px 14px;border:0.5px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface-1)}
.sec{font-size:13px;color:var(--text-secondary);margin:18px 16px 8px}
.ttl{margin:6px 16px 12px;font-size:22px;font-weight:500}
.pill{padding:5px 14px;border-radius:999px;font-size:13px;border:0.5px solid var(--border-strong);color:var(--text-secondary)}
.pill.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.b1{text-align:center;background:var(--fill-accent);color:var(--on-accent);padding:10px 14px;border-radius:var(--radius);font-size:15px}
.b2{text-align:center;border:0.5px solid var(--border-strong);padding:10px 14px;border-radius:var(--radius);font-size:15px}
.lb{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:6px}
@keyframes gr{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tk.an{transform-origin:left;animation:gr .55s ease-out both}
@media (prefers-reduced-motion:reduce){.tk.an{animation:none}}
</style>

const p=P[c.p],pt=pot(c.pot),others=C.filter(x=>x.pot===c.pot&&x.id!==c.id&&!x.closed);
let h=hd(c.n,true)+`<div class="sm" style="margin:-6px 16px 10px">${ownL(c.o)}${c.closed?", closed "+c.closed:""}</div>`;
const row=(l,v,go)=>go?btn(go,`<span class="sm" style="flex:1">${l}</span><span style="font-size:15px">${v}</span><i class="ti ti-chevron-right" style="color:var(--text-muted)" aria-hidden="true"></i>`,"rw tap"):`<div class="rw"><span class="sm" style="flex:1">${l}</span><span style="font-size:15px;text-align:right">${v}</span></div>`;
h+=row("Earns",`<span class="dot" style="display:inline-block;${dotc(p.h)};margin-right:6px"></span>${p.s} ${p.u}`,"prog:"+c.p);
h+=row(others.length?"Shared pot":p.perCard?"On this card":`In ${ownL(pt?pt.o:c.o)}'s account`,pt?fmt(pt.b):"None");
h+=row("Annual fee",c.fee==null?"Not entered":c.fee===0?"None":"$"+fmt(c.fee));
h+=row("Fee posts in",c.mo?MON[c.mo]:"Not entered");
h+=`<div style="border-top:0.5px solid var(--border)"></div>`;
if(c.fee>0&&!c.closed)h+=`<div class="sec">Before the next fee, the plan is to</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 16px">${["Keep","Downgrade","Cancel"].map(d=>btn(`dec:${c.id}:${d}`,d,"tap pill"+(c.dec===d?" on":""))).join("")}</div>`;
if(!c.closed){
h+=`<div style="display:flex;gap:8px;margin:20px 16px 0">${btn("editcard:"+c.id,"Edit card","tap b2","flex:1")}${c.fee>0&&c.mo?btn("cal:"+c.id,'<i class="ti ti-calendar-plus" aria-hidden="true"></i> Add to calendar',"tap b2","flex:1"):""}</div>`;
h+=`<div style="margin:12px 16px 20px">${btn("close:"+c.id,"Close or delete card","tap b2","color:var(--text-danger);border-color:var(--border-danger)")}</div>`;}
else h+=`<p class="sm" style="margin:14px 16px 20px">Kept as a record. Some banks limit sign-up bonuses based on cards you've had before.</p>`;
return h}
function closeV(id){
const c=card(id),p=P[c.p],pt=pot(c.pot),others=C.filter(x=>x.pot===c.pot&&x.id!==c.id&&!x.closed);
let h=hd("Close "+c.n,true);
if(others.length)h+=box("--surface-1","--text-secondary",`Your ${p.s} points stay put. The ${others[0].n} still feeds the same pot.`);
else if(p.perCard||c.p==="amex"){if(pt&&pt.b>0)h+=box("--bg-warning","--text-warning",`This card holds ${fmt(pt.b)} ${p.u}. Move them to ${p.s==="Chase"?"a Sapphire Preferred or another Chase card":"another "+p.s+" card"} first, or they may be lost when the card closes.`);else h+=box("--surface-1","--text-secondary","No points are left on this card.");}
else h+=box("--surface-1","--text-secondary",`Your ${p.s} points live in the ${p.s} account, not on the card, so they stay after the card closes.`);
h+=`<div class="sec">Choose one</div>`;
h+=btn("closecard:"+id,`<i class="ti ti-archive" style="font-size:20px;color:var(--text-secondary)" aria-hidden="true"></i><div style="flex:1"><div style="font-size:15px">Move to closed cards</div><div class="sm">Keeps a record of when you had it. Some banks limit sign-up bonuses based on past cards.</div></div>`,"rw tap");
h+=btn("delcard:"+id,`<i class="ti ti-trash" style="font-size:20px;color:var(--text-danger)" aria-hidden="true"></i><div style="flex:1"><div style="font-size:15px;color:var(--text-danger)">Delete completely</div><div class="sm">Removes it with no record. Best for cards added by mistake.</div></div>`,"rw tap");
h+=`<div style="border-top:0.5px solid var(--border);margin-bottom:20px"></div>`;
return h}
function formV(){
const id=V()[1],f=S.form,isNew=!id;
let h=hd(isNew?"Add a card":"Edit card",true);
h+=fld("n","Nickname",f.n,`placeholder="Abby's Hyatt card"`);
h+=pills(f.o);
if(isNew){
h+=`<div style="margin:0 16px 14px"><label class="lb" for="f-p">Earns</label><select id="f-p" name="p" style="width:100%">${Object.keys(P).map(k=>`<option value="${k}"${f.p===k?" selected":""}>${P[k].n}</option>`).join("")}<option value="new"${f.p==="new"?" selected":""}>A new program</option></select><div class="sm" style="margin-top:6px">${f.p==="new"?"Creates a new program on your Points tab.":P[f.p].perCard?"Gets its own balance, starting at 0.":"Joins your existing "+P[f.p].s+" balance."}</div></div>`;
if(f.p==="new")h+=fld("np","Program name",f.np,`placeholder="World of Hyatt"`)+fld("nb","Starting balance",f.nb,`inputmode="numeric" placeholder="0"`);
}else h+=`<div style="margin:0 16px 14px"><div class="lb">Earns</div><div style="font-size:15px">${P[card(id).p].n}</div><div class="sm">To switch programs, close this card and add a new one.</div></div>`;
h+=fld("fee","Annual fee in dollars (optional)",f.fee,`inputmode="numeric" placeholder="95"`);
h+=`<div style="margin:0 16px 14px"><label class="lb" for="f-mo">Fee posts in (optional)</label><select id="f-mo" name="mo" style="width:100%"><option value="">Not sure yet</option>${MON.slice(1).map((m,i)=>`<option value="${i+1}"${String(f.mo)===String(i+1)?" selected":""}>${m}</option>`).join("")}</select></div>`;
h+=`<div style="display:flex;gap:8px;margin:18px 16px 20px;border-top:0.5px solid var(--border);padding-top:16px">${btn("savecard",isNew?"Add card":"Save changes","tap b1","flex:1")}${btn("back","Cancel","tap b2")}</div>`;
return h}
function acctV(){
const f=S.form;
let h=hd("Add an account",true)+`<p class="sm" style="margin:-4px 16px 14px">For points in an airline or hotel account with no card attached, like points you've moved to British Airways.</p>`;
h+=`<div style="margin:0 16px 14px"><label class="lb" for="f-p">Program</label><select id="f-p" name="p" style="width:100%"><option value="new"${f.p==="new"?" selected":""}>A new program</option>${Object.keys(P).filter(k=>!F.includes(k)).map(k=>`<option value="${k}"${f.p===k?" selected":""}>${P[k].n}</option>`).join("")}</select></div>`;
if(f.p==="new")h+=fld("np","Program name",f.np,`placeholder="British Airways Avios"`);
h+=pills(f.o);
h+=fld("nb","Current balance",f.nb,`inputmode="numeric" placeholder="25000"`);
h+=`<div style="display:flex;gap:8px;margin:18px 16px 20px;border-top:0.5px solid var(--border);padding-top:16px">${btn("saveacct","Add account","tap b1","flex:1")}${btn("back","Cancel","tap b2")}</div>`;
return h}
function priceV(){
const v=V(),t=T[v[1]],pt=t.parts[v[2]],f=S.form;
let h=hd("Real price",true)+`<p class="sm" style="margin:-4px 16px 14px">${t.n} ${pt.l.toLowerCase()}: ${pt.d}</p>`;
h+=fld("pts",pt.l==="Hotel"?"Total points for the whole stay":"Total points for all 4 travelers",f.pts,`inputmode="numeric" placeholder="312000"`);
h+=`<div style="margin:0 16px 14px"><label class="lb" for="f-src">Where you found it</label><select id="f-src" name="src" style="width:100%">${["seats.aero","point.me","Airline website","Hotel website or app"].map(s=>`<option${f.src===s?" selected":""}>${s}</option>`).join("")}</select></div>`;
h+=`<p class="sm" style="margin:0 16px 14px">Today's date is saved with the price, since award prices change daily.</p>`;
h+=`<div style="display:flex;gap:8px;margin:18px 16px 0;border-top:0.5px solid var(--border);padding-top:16px">${btn("saveprice","Save price","tap b1","flex:1")}${btn("back","Cancel","tap b2")}</div>`;
h+=pt.real?`<div style="margin:14px 16px 20px">${btn("clearprice","Go back to the estimate","tap","font-size:14px;color:var(--text-accent);display:inline-block")}</div>`:`<div style="height:20px"></div>`;
return h}
function trips(){
let h=hd("Trips");
Object.keys(T).forEach(k=>{const t=T[k];
h+=`<div class="tc tap" role="button" tabindex="0" data-go="trip:${k}"><div style="padding:14px 16px 12px;display:flex;justify-content:space-between;align-items:flex-start"><div><div style="font-size:19px;font-weight:500">${t.n}</div><div class="sm">${t.sub}, 4 travelers from Boston</div></div><i class="ti ti-chevron-right" style="color:var(--text-muted);margin-top:4px" aria-hidden="true"></i></div><div style="display:flex;align-items:center"><span style="width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--surface-2);border:0.5px solid var(--border);flex:none"></span><span style="flex:1;border-top:1.5px dashed var(--border-strong);margin:0 4px"></span><span style="width:14px;height:14px;margin-right:-7px;border-radius:50%;background:var(--surface-2);border:0.5px solid var(--border);flex:none"></span></div><div style="padding:12px 16px 14px;display:grid;gap:10px">`+t.parts.map(pt=>{const c=cov(pt);return `<div><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span><i class="ti ${pt.i}" aria-hidden="true"></i> ${pt.l}<span style="color:var(--text-muted)">, ${pt.real?"real price":"estimate"}</span></span><span style="color:${c.pct>=100?"var(--text-success)":"var(--text-warning)"}">${c.pct>=100?"Covered":c.pct+"% covered"}</span></div>${bar(c.pct)}</div>`}).join("")+`</div></div>`;});
h+=`<p class="sm" style="margin:4px 16px 20px">Bars are rough for now. They don't yet apply transfer ratios, and all three trips count the same points.</p>`;
return h}
function trip(k){
const t=T[k];let h=hd(t.n,true);
h+=`<div class="sm" style="margin:-6px 16px 4px">${t.sub}, from Boston</div>`;
h+=`<div class="sec">Travelers</div><div style="margin:0 16px">`+["Jess","Abby","Kid, 14","Kid, 10"].map(x=>`<span class="chip" style="background:var(--surface-1);color:var(--text-primary);border:0.5px solid var(--border)">${x}</span>`).join("")+`</div>`;
t.parts.forEach((pt,i)=>{const c=cov(pt);
const tag=pt.real?`<span class="chip" style="background:var(--bg-success);color:var(--text-success);margin:8px 0 0">Real price from ${pt.real.src}, checked ${pt.real.date}</span>`:`<span class="chip" style="background:var(--surface-1);color:var(--text-secondary);border:0.5px solid var(--border);margin:8px 0 0">Estimate</span>`;
h+=`<div class="sec">${pt.l}</div><div style="margin:0 16px;padding:12px 14px;border:0.5px solid var(--border);border-radius:12px"><div style="display:flex;justify-content:space-between;gap:8px"><div><div style="font-size:15px">${pt.d}</div><div class="sm">${pt.real?fmt(c.n)+" points":"About "+fmt(c.n)+" points"}</div>${tag}</div><i class="ti ${pt.i}" style="font-size:20px;color:var(--text-muted)" aria-hidden="true"></i></div><div style="margin:12px 0 6px">${bar(c.pct)}</div><div class="sm">${fmt(Math.min(c.have,c.n))} of ${fmt(c.n)} covered by your ${pt.src.map(s=>P[s].s).join(", ")} ${pt.src.length>1?"balances":"balance"}</div>${btn(`price:${k}:${i}`,pt.real?"Update price":"Enter real price","tap b2","font-size:14px;padding:7px 12px;display:inline-block;margin-top:10px")}<div class="sm" style="margin:14px 0 4px">Ways to pay</div>`+pt.pay.map(([nm,fr])=>`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 0;border-top:0.5px solid var(--border);font-size:14px"><span style="flex:1;min-width:0">${nm}</span><span style="text-align:right;max-width:55%">${fr.map(f=>ttag(f,"margin:0 0 4px 4px")).join("")}</span></div>`).join("")+`</div>`;});
h+=`<div class="sec">Good to know for a family of 4</div>`+t.notes.map(n=>`<div class="rw" style="align-items:flex-start"><i class="ti ti-info-circle" style="color:var(--text-secondary);font-size:18px;margin-top:2px" aria-hidden="true"></i><span style="font-size:14px;line-height:1.5">${n}</span></div>`).join("");
const lk="flex:1;text-align:center;font-size:14px;padding:10px 8px;border:0.5px solid var(--border-strong);border-radius:var(--radius);color:var(--text-primary);text-decoration:none";
h+=`<div style="display:flex;gap:8px;margin:14px 16px 20px;border-top:0.5px solid var(--border);padding-top:14px"><a href="https://www.point.me" style="${lk}">Search point.me <i class="ti ti-external-link" aria-hidden="true"></i></a><a href="https://seats.aero" style="${lk}">Search seats.aero <i class="ti ti-external-link" aria-hidden="true"></i></a></div>`;
return h}
function upd(){
let h=hd("Update balances",true);
h+=`<p class="sm" style="margin:-4px 16px 12px">Type what each bank or hotel app shows. Saving updates both phones.</p>`;
A.forEach(a=>{const v=S.draft?S.draft[a.k]:a.b;
h+=`<div class="rw" style="flex-wrap:wrap"><span class="dot" style="${dotc(P[a.p].h)}"></span><label for="in-${a.k}" style="flex:1;min-width:0;font-size:14px;line-height:1.4">${ownL(a.o)}'s ${a.l}</label><input id="in-${a.k}" data-k="${a.k}" inputmode="numeric" value="${esc(v)}" style="width:110px;text-align:right"><div id="er-${a.k}" style="width:100%;font-size:13px;color:var(--text-danger);text-align:right;${S.err[a.k]?"":"display:none"}">Enter a whole number, like 48200</div></div>`;});
h+=`<div style="display:flex;gap:8px;margin:0 16px 20px;border-top:0.5px solid var(--border);padding-top:16px">${btn("save","Save balances","tap b1","flex:1")}${btn("back","Cancel","tap b2")}</div>`;
return h}
const scr=document.getElementById("scr"),tabs=document.getElementById("tabs"),ph=document.getElementById("ph");
let spT;
function render(){
if(S.screen==="splash"){scr.innerHTML=splash();tabs.innerHTML="";tabs.style.display="none";return}
tabs.style.display="flex";
const v=V();let h;
if(v){const t=v[0];h=t==="prog"?prog(v[1]):t==="trip"?trip(v[1]):t==="card"?cardV(v[1]):t==="close"?closeV(v[1]):t==="cardform"?formV():t==="acct"?acctV():t==="price"?priceV():upd();}
else h={points,cards,trips}[S.tab]();
scr.innerHTML=(S.toast?`<div style="margin:12px 16px 0;padding:10px 12px;border-radius:var(--radius);background:var(--bg-success);color:var(--text-success);font-size:14px"><i class="ti ti-check" aria-hidden="true"></i> ${S.toast}</div>`:"")+h;
tabs.innerHTML=[["points","ti-coins","Points"],["cards","ti-credit-card","Cards"],["trips","ti-plane","Trips"]].map(([k,i,l])=>`<div class="tb${S.tab===k?" on":""}" role="button" tabindex="0" data-go="tab:${k}"><i class="ti ${i}" style="font-size:22px" aria-hidden="true"></i>${l}</div>`).join("");
}
function showSplash(){S.screen="splash";render();clearTimeout(spT);spT=setTimeout(()=>{if(S.screen==="splash"){S.screen="app";render()}},2400)}
function newProg(name){const k="x"+(++seq);P[k]={n:name,s:name,h:"green",u:"points",air:[],hot:[],note:"Added by you. Partner details aren't filled in for added programs yet."};return k}
function newPot(p,o,l,b){const k="p"+(++seq);A.push({k,p,o,l,b});return k}
const num=v=>String(v||"").replace(/[$,\s]/g,"");
function saveBal(){
let bad=false;const raw={},vals={};
A.forEach(a=>{const r=document.getElementById("in-"+a.k).value;raw[a.k]=r;const c=num(r);
if(!/^\d+$/.test(c)){S.err[a.k]=1;bad=true}else{delete S.err[a.k];vals[a.k]=parseInt(c,10)}});
if(bad){S.draft=raw;render();return}
A.forEach(a=>{a.b=vals[a.k]});S.days=0;S.draft=null;S.err={};S.stack=[];S.tab="points";S.toast="Balances saved";render();
}
function saveCard(){
const f=S.form,id=V()[1];S.err={};
if(!f.n.trim())S.err.n="Enter a nickname, like Abby's Hyatt card";
const fee=num(f.fee);if(fee&&!/^\d+$/.test(fee))S.err.fee="Enter a whole dollar amount, like 95";
if(!id&&f.p==="new"){if(!f.np.trim())S.err.np="Enter the program name, like World of Hyatt";if(!/^\d+$/.test(num(f.nb)))S.err.nb="Enter a whole number, like 0 or 25000";}
if(Object.keys(S.err).length){render();return}
const feeV=fee===""?null:parseInt(fee,10),moV=f.mo?parseInt(f.mo,10):null;
if(id){const c=card(id);c.n=f.n.trim();c.o=f.o;c.fee=feeV;c.mo=moV;const pt=pot(c.pot);if(pt&&P[c.p].perCard&&!C.some(x=>x.pot===c.pot&&x.id!==c.id)){pt.l=c.n;pt.o=c.o}S.stack.pop();S.toast="Changes saved";render();return}
let pk=f.p,pk2;
if(pk==="new"){pk=newProg(f.np.trim());pk2=newPot(pk,f.o,P[pk].s+" account",parseInt(num(f.nb),10))}
else if(P[pk].perCard)pk2=newPot(pk,f.o,f.n.trim(),0);
else{const ex=A.find(a=>a.p===pk&&(a.o===f.o||a.o==="Both"||f.o==="Both"))||A.find(a=>a.p===pk);pk2=ex?ex.k:newPot(pk,f.o,P[pk].s+" account",0)}
C.push({id:"c"+(++seq),n:f.n.trim(),o:f.o,p:pk,pot:pk2,fee:feeV,mo:moV,dec:""});
S.stack=[];S.tab="cards";S.toast="Card added";render();
}
function saveAcct(){
const f=S.form;S.err={};
if(f.p==="new"&&!f.np.trim())S.err.np="Enter the program name, like British Airways Avios";
if(!/^\d+$/.test(num(f.nb)))S.err.nb="Enter a whole number, like 25000";
if(Object.keys(S.err).length){render();return}
const pk=f.p==="new"?newProg(f.np.trim()):f.p;
newPot(pk,f.o,P[pk].s+" account",parseInt(num(f.nb),10));
S.stack=[];S.tab="points";S.toast="Account added";render();
}
function savePrice(){
const v=V(),pt=T[v[1]].parts[v[2]],f=S.form;S.err={};
const p=num(f.pts);if(!/^\d+$/.test(p)||parseInt(p,10)===0){S.err.pts="Enter the total points, like 312000";render();return}
pt.real={pts:parseInt(p,10),src:f.src,date:"Sept 10"};S.stack.pop();S.toast="Price saved";render();
}
function go(a,b,c){
if(a==="save"){saveBal();return}
if(a==="savecard"){saveCard();return}
if(a==="saveacct"){saveAcct();return}
if(a==="saveprice"){savePrice();return}
if(a==="fo"){S.form.o=b;render();return}
S.toast="";
if(a==="open"){S.screen="app";clearTimeout(spT)}
else if(a==="splash"){showSplash();return}
else if(a==="tab"){S.tab=b;S.stack=[]}
else if(a==="prog"||a==="trip"||a==="card"||a==="close")S.stack.push([a,b]);
else if(a==="back"){S.stack.pop();S.err={};S.draft=null}
else if(a==="update"){S.stack.push(["upd"]);S.err={};S.draft=null}
else if(a==="f")S.f=b;
else if(a==="dismiss")S.alerts=S.alerts.filter(x=>x.id!==b);
else if(a==="addcard"){S.form={n:"",o:"Jess",p:"chase",np:"",nb:"",fee:"",mo:""};S.err={};S.stack.push(["cardform",null])}
else if(a==="editcard"){const x=card(b);S.form={n:x.n,o:x.o,p:x.p,np:"",nb:"",fee:x.fee==null?"":String(x.fee),mo:x.mo?String(x.mo):""};S.err={};S.stack.push(["cardform",b])}
else if(a==="addacct"){S.form={p:"new",np:"",o:"Jess",nb:""};S.err={};S.stack.push(["acct"])}
else if(a==="price"){const pt=T[b].parts[+c];S.form={pts:pt.real?String(pt.real.pts):"",src:pt.real?pt.real.src:"seats.aero"};S.err={};S.stack.push(["price",b,+c])}
else if(a==="clearprice"){const v=V();delete T[v[1]].parts[v[2]].real;S.stack.pop();S.toast="Back to the estimate"}
else if(a==="dec"){const x=card(b);x.dec=x.dec===c?"":c}
else if(a==="cal")S.toast="In the real app, this adds the fee date to your iPhone calendar";
else if(a==="closecard"){const x=card(b);x.closed="Sept 2026";x.dec="";S.stack=[];S.tab="cards";S.toast="Moved to closed cards"}
else if(a==="delcard"){const i=C.findIndex(x=>x.id===b);if(i>-1)C.splice(i,1);S.stack=[];S.tab="cards";S.toast="Card deleted"}
render();
}
ph.addEventListener("click",e=>{const el=e.target.closest("[data-go]");if(!el||!ph.contains(el))return;const [a,b,c]=el.dataset.go.split(":");go(a,b,c)});
ph.addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const t=e.target;if(t.tagName==="INPUT"||t.tagName==="SELECT")return;const el=t.closest("[data-go]");if(!el)return;e.preventDefault();el.click()});
ph.addEventListener("input",e=>{const t=e.target;
if(t.dataset&&t.dataset.k){const k=t.dataset.k;delete S.err[k];const er=document.getElementById("er-"+k);if(er)er.style.display="none";return}
if(t.name&&S.form){S.form[t.name]=t.value;if(S.err[t.name]){delete S.err[t.name];const er=document.getElementById("er-"+t.name);if(er)er.style.display="none"}}});
ph.addEventListener("change",e=>{const t=e.target;if(t.name==="p"&&S.form){S.form.p=t.value;render()}});
showSplash();
</script>

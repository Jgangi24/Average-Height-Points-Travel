.tc{margin:0 16px 14px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--paper-2)}

.frame{position:absolute;inset:0;opacity:0}

.frame.f1{animation:frm1 1.1s steps(1) forwards}

function showSplash(){S.screen="splash";render();clearTimeout(spT);spT=setTimeout(()=>{if(S.screen==="splash"){S.screen="app";render()}},2600)}
function newProg(name){const k="x"+(++seq);P[k]={n:name,s:name,h:"green",u:"points",air:[],hot:[],note:"Added by you. Partner details aren't filled in for added programs yet."};return k}
function newPot(p,o,l,b){const k="p"+(++seq);A.push({k,p,o,l,b});return k}
const num=v=>String(v||"").replace(/[$,\s]/g,"");
function saveBal(){
let bad=false;const raw={},vals={};
A.forEach(a=>{const r=document.getElementById("in-"+a.k).value;raw[a.k]=r;const c=num(r);
if(!/^\d+$/.test(c)){S.err[a.k]=1;bad=true}else{delete S.err[a.k];vals[a.k]=parseInt(c,10)}});
if(bad){S.draft=raw;render();return}
A.forEach(a=>{a.b=vals[a.k]});S.days=0;S.draft=null;S.err={};S.stack=[];S.tab="points";S.toast="Balances saved";render();
}
function saveCard(){
const f=S.form,id=V()[1];S.err={};
if(!f.n.trim())S.err.n="Enter a nickname, like Abby's Hyatt card";
const fee=num(f.fee);if(fee&&!/^\d+$/.test(fee))S.err.fee="Enter a whole dollar amount, like 95";
if(!id&&f.p==="new"){if(!f.np.trim())S.err.np="Enter the program name, like World of Hyatt";if(!/^\d+$/.test(num(f.nb)))S.err.nb="Enter a whole number, like 0 or 25000";}
if(Object.keys(S.err).length){render();return}
const feeV=fee===""?null:parseInt(fee,10),moV=f.mo?parseInt(f.mo,10):null;
if(id){const c=card(id);c.n=f.n.trim();c.o=f.o;c.fee=feeV;c.mo=moV;const pt=pot(c.pot);if(pt&&P[c.p].perCard&&!C.some(x=>x.pot===c.pot&&x.id!==c.id)){pt.l=c.n;pt.o=c.o}S.stack.pop();S.toast="Changes saved";render();return}
let pk=f.p,pk2;
if(pk==="new"){pk=newProg(f.np.trim());pk2=newPot(pk,f.o,P[pk].s+" account",parseInt(num(f.nb),10))}
else if(P[pk].perCard)pk2=newPot(pk,f.o,f.n.trim(),0);
else{const ex=A.find(a=>a.p===pk&&(a.o===f.o||a.o==="Both"||f.o==="Both"))||A.find(a=>a.p===pk);pk2=ex?ex.k:newPot(pk,f.o,P[pk].s+" account",0)}
C.push({id:"c"+(++seq),n:f.n.trim(),o:f.o,p:pk,pot:pk2,fee:feeV,mo:moV,dec:""});
S.stack=[];S.tab="cards";S.toast="Card added";render();
}
function saveAcct(){

function saveTrip(){
const k=V()[1],t=trip(k),f=S.form;S.err={};
if(!f.n.trim())S.err.n="Enter a destination name";
if(!/^\d+$/.test(num(f.fneed))||parseInt(num(f.fneed),10)===0)S.err.fneed="Enter the estimated points needed, like 240000";
if(!/^\d+$/.test(num(f.hneed))||parseInt(num(f.hneed),10)===0)S.err.hneed="Enter the estimated points needed, like 200000";

function saveRedate(id){
const pk=PK.find(x=>x.id===id),v=document.getElementById("f-redate").value.trim();
const m=v.match(/([A-Za-z]+)\s+(\d{1,2}),?\s+(\d{4})/);
if(!m){S.err.redate="Use a format like Sept 10, 2026";render();return}
const mi=MON.findIndex(x=>x.toLowerCase().startsWith(m[1].slice(0,3).toLowerCase()));
if(mi<1){S.err.redate="Use a format like Sept 10, 2026";render();return}
pk.doneDate=new Date(parseInt(m[3],10),mi-1,parseInt(m[2],10));delete S.err.redate;S.toast="Date updated";render();
}
function go(a,b,c){
if(a==="save"){saveBal();return}
if(a==="savecard"){saveCard();return}
if(a==="saveacct"){saveAcct();return}
if(a==="saveprice"){savePrice();return}
if(a==="savetrip"){saveTrip();return}
if(a==="saveredate"){saveRedate(b);return}
if(a==="fo"){S.form.o=b;render();return}
if(a==="fsrc"){const i=S.form.fsrc.indexOf(b);i>-1?S.form.fsrc.splice(i,1):S.form.fsrc.push(b);render();return}
if(a==="hsrc"){const i=S.form.hsrc.indexOf(b);i>-1?S.form.hsrc.splice(i,1):S.form.hsrc.push(b);render();return}
if(a==="fold"){S.folds[b]=!S.folds[b];render();return}
if(a==="progFromAlert"){progFromAlert(b);return}
S.toast="";
if(a==="open"){S.screen="app";clearTimeout(spT)}
else if(a==="splash"){showSplash();return}
else if(a==="tab"){S.tab=b;S.stack=[]}
else if(a==="prog"||a==="trip"||a==="card"||a==="close"||a==="perk")S.stack.push([a,b]);
else if(a==="openalerts")S.stack.push(["alerts"]);
else if(a==="back"){S.stack.pop();S.err={};S.draft=null}
else if(a==="update"){S.stack.push(["upd"]);S.err={};S.draft=null}
else if(a==="f")S.f=b;
else if(a==="dismiss")S.alerts=S.alerts.filter(x=>x.id!==b);
else if(a==="toggleperk"){const pk=PK.find(x=>x.id===b);if(pk){if(pk.status==="open"){pk.status="done";pk.doneDate=new Date(TODAY)}else{pk.status="open"}}}
else if(a==="addperk")S.toast="In the full app, this opens a form to add a new perk";
else if(a==="addcard"){S.form={n:"",o:"Jess",p:"chase",np:"",nb:"",fee:"",mo:""};S.err={};S.stack.push(["cardform",null])}
else if(a==="editcard"){const x=card(b);S.form={n:x.n,o:x.o,p:x.p,np:"",nb:"",fee:x.fee==null?"":String(x.fee),mo:x.mo?String(x.mo):""};S.err={};S.stack.push(["cardform",b])}
else if(a==="addacct"){S.form={p:"new",np:"",o:"Jess",nb:""};S.err={};S.stack.push(["acct"])}
else if(a==="edittrip"){const t=trip(b);S.form={n:t.n,sub:t.sub,notes:t.notes.join("\n"),fd:t.flights.d,fneed:String(t.flights.need),fsrc:t.flights.src.slice(),hd:t.hotel.d,hneed:String(t.hotel.need),hsrc:t.hotel.src.slice()};S.err={};S.stack.push(["edittrip",b])}
else if(a==="price"){const t=trip(b),pt=c==="flights"?t.flights:t.hotel;S.form={pts:pt.real?String(pt.real.pts):"",src:pt.real?pt.real.src:"seats.aero"};S.err={};S.stack.push(["price",b,c])}
else if(a==="clearprice"){const v=V(),t=trip(v[1]);delete (v[2]==="flights"?t.flights:t.hotel).real;S.stack.pop();S.toast="Back to the estimate"}
else if(a==="dec"){const x=card(b);x.dec=x.dec===c?"":c}
else if(a==="cal")S.toast="In the real app, this adds the fee date to your iPhone calendar";
else if(a==="closecard"){const x=card(b);x.closed="Sept 2026";x.dec="";S.stack=[];S.tab="cards";S.toast="Moved to closed cards"}
else if(a==="delcard"){const i=C.findIndex(x=>x.id===b);if(i>-1)C.splice(i,1);S.stack=[];S.tab="cards";S.toast="Card deleted"}
render();
}
ph.addEventListener("click",e=>{const el=e.target.closest("[data-go]");if(!el)return;const [a,b,c]=el.dataset.go.split(":");go(a,b,c)});
topbar.addEventListener("click",e=>{const el=e.target.closest("[data-go]");if(!el)return;const [a,b,c]=el.dataset.go.split(":");go(a,b,c)});
ph.addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const t=e.target;if(t.tagName==="INPUT"||t.tagName==="SELECT"||t.tagName==="TEXTAREA")return;const el=t.closest("[data-go]");if(!el)return;e.preventDefault();el.click()});
ph.addEventListener("input",e=>{const t=e.target;
if(t.dataset&&t.dataset.k){const k=t.dataset.k;delete S.err[k];const er=document.getElementById("er-"+k);if(er)er.style.display="none";return}
if(t.name&&S.form){S.form[t.name]=t.value;if(S.err[t.name]){delete S.err[t.name];const er=document.getElementById("er-"+t.name);if(er)er.style.display="none"}}});
ph.addEventListener("change",e=>{const t=e.target;if(t.name==="p"&&S.form){S.form.p=t.value;render()}});
showSplash();
</script>
</body>
</html>

const card=id=>C.find(c=>c.id===id);
const pot=k=>A.find(a=>a.k===k);
const trip=k=>T.find(t=>t.key===k);
const days=(a,b)=>Math.round((b-a)/86400000);
const dfmt=d=>d? MON[d.getMonth()+1].slice(0,3)+" "+d.getDate()+", "+d.getFullYear() : "";
const btn=(go,inner,cls,st,extra)=>`<div class="${cls||"tap"}" role="button" tabindex="0" data-go="${go}" style="${st||""}" ${extra||""}>${inner}</div>`;
const hd=(t,back)=>(back?`<div style="padding:6px 16px 0">${btn("back",ic("chevronLeft",17)+' Back',"bk")}</div>`:`<div style="height:10px"></div>`)+`<div class="ttl">${t}</div>`;
const box=(bg,fg,txt)=>`<div style="margin:0 16px 14px;padding:10px 12px;border-radius:var(--radius);background:var(${bg});color:var(${fg});font-size:13px;line-height:1.5">${txt}</div>`;
const needOf=pt=>pt.real?pt.real.pts:pt.need;
const cov=pt=>{const have=pt.src.reduce((s,k)=>s+tot(k),0),n=needOf(pt);return{have,n,pct:Math.min(100,Math.round(have/n*100))}};
const bar=p=>`<div class="bar"><span style="width:${p}%;background:${p>=100?"var(--success)":"var(--warning)"}"></span></div>`;
const ttag=(k,extra)=>`<span class="chip" style="${tint(P[k].h)};${extra||""}">${P[k].s}</span>`;
const feeStr=c=>c.fee==null?"Fee not entered":c.fee===0?"No annual fee":`$${fmt(c.fee)} fee${c.mo?" in "+MON[c.mo]:""}`;
const errH=k=>`<div id="er-${k}" style="font-size:13px;color:var(--danger);margin-top:4px;${S.err[k]?"":"display:none"}">${S.err[k]||""}</div>`;
const fld=(k,label,val,attrs)=>`<div style="margin:0 16px 14px"><label class="lb" for="f-${k}">${label}</label><input id="f-${k}" name="${k}" value="${esc(val)}" ${attrs||""} style="width:100%">${errH(k)}</div>`;
const pills=(cur)=>`<div style="margin:0 16px 14px"><div class="lb">Belongs to</div><div style="display:flex;gap:8px">${["Jess","Abby","Both"].map(o=>btn("fo:"+o,o==="Both"?"Both of you":o,"tap pill"+(cur===o?" on":""))).join("")}</div></div>`;
function multiPills(prefix,keys,cur){return `<div style="display:flex;flex-wrap:wrap;gap:6px 0">${keys.map(k=>btn(prefix+":"+k,P[k].s,"tap pill"+(cur.includes(k)?" on":""))).join("")}</div>`}
/* computed "ways to pay" for a trip leg, derived from its src programs so a swapped destination needs no code change */
function waysToPay(kind,srcKeys){
const rows=[]; const seen={};
srcKeys.forEach(k=>{(P[k][kind]||[]).forEach(name=>{if(!seen[name])seen[name]=[];if(!seen[name].includes(k))seen[name].push(k);});});
Object.keys(seen).forEach(name=>rows.push([name,seen[name]]));
return rows;
}

function closesInDays(pk){if(pk.cad==="monthly"||!pk.windowEnd)return null;const d=days(TODAY,pk.windowEnd);return d}
function redeemedTotals(){
let month=0,year=0;
PK.forEach(pk=>{
const events=pk.hist.filter(x=>x.used).map(x=>x.date).concat(pk.status==="done"?[pk.doneDate]:[]);
events.forEach(d=>{if(d.getFullYear()===TODAY.getFullYear()){year+=pk.value;if(d.getMonth()===TODAY.getMonth())month+=pk.value;}});
});
return{month,year};
}

let h=hd("Trips");
T.forEach(t=>{
h+=`<div class="tc tap" role="button" tabindex="0" data-go="trip:${t.key}"><div style="padding:14px 16px 12px;display:flex;justify-content:space-between;align-items:flex-start"><div><div style="font-size:19px;font-weight:600">${t.n}</div><div class="sm">${t.sub}, 4 travelers from Boston</div></div>${ic("chevronRight",18)}</div><div style="display:flex;align-items:center"><span style="width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--paper);border:1px solid var(--line);flex:none"></span><span style="flex:1;border-top:1.5px dashed var(--line-strong);margin:0 4px"></span><span style="width:14px;height:14px;margin-right:-7px;border-radius:50%;background:var(--paper);border:1px solid var(--line);flex:none"></span></div><div style="padding:12px 16px 14px;display:grid;gap:10px">`+
[["Flights",t.flights],["Hotel",t.hotel]].map(([l,pt])=>{const c=cov(pt);return `<div><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>${l}<span style="color:var(--ink-muted)">, ${pt.real?"real price":"estimate"}</span></span><span style="color:${c.pct>=100?"var(--success)":"var(--warning)"}">${c.pct>=100?"Covered":c.pct+"% covered"}</span></div>${bar(c.pct)}</div>`}).join("")+`</div></div>`;});
h+=`<p class="sm" style="margin:4px 16px 20px">Bars are rough for now. They don't yet apply transfer ratios, and all three trips count the same points. There are always 3 trip slots — edit a trip to swap in a new destination.</p>`;
return h}
function tripV(k){
const t=trip(k);let h=hd(t.n,true);
h+=`<div class="sm" style="margin:-6px 16px 4px">${t.sub}, from Boston</div>`;
h+=`<div style="margin:6px 16px 4px">${btn("edittrip:"+k,ic("pencil",15)+" Edit this trip","tap","font-size:13px;color:var(--accent);display:inline-flex;align-items:center;gap:5px")}</div>`;
h+=`<div class="sec">Travelers</div><div style="margin:0 16px">`+["Jess","Abby","Kid, 14","Kid, 10"].map(x=>`<span class="chip" style="background:var(--paper-2);color:var(--ink);border:1px solid var(--line)">${x}</span>`).join("")+`</div>`;
[["flights","Flights",t.flights],["hotel","Hotel",t.hotel]].forEach(([pkey,l,pt])=>{const c=cov(pt);
const tag=pt.real?`<span class="chip" style="background:var(--success-bg);color:var(--success);margin:8px 0 0">Real price from ${pt.real.src}, checked ${pt.real.date}</span>`:`<span class="chip" style="background:var(--paper-2);color:var(--ink-soft);border:1px solid var(--line);margin:8px 0 0">Estimate</span>`;
h+=`<div class="sec">${l}</div><div style="margin:0 16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper-2)"><div style="display:flex;justify-content:space-between;gap:8px"><div><div style="font-size:15px">${pt.d}</div><div class="sm">${pt.real?fmt(c.n)+" points":"About "+fmt(c.n)+" points"}</div>${tag}</div>${ic(pkey==="flights"?"plane":"card",20)}</div><div style="margin:12px 0 6px">${bar(c.pct)}</div><div class="sm">${fmt(Math.min(c.have,c.n))} of ${fmt(c.n)} covered by your ${pt.src.map(s=>P[s].s).join(", ")} ${pt.src.length>1?"balances":"balance"}</div>${btn(`price:${k}:${pkey}`,pt.real?"Update price":"Enter real price","tap b2","font-size:14px;padding:7px 12px;display:inline-block;margin-top:10px;width:auto")}<div class="sm" style="margin:14px 0 4px">Ways to pay</div>`+
waysToPay(pkey==="flights"?"air":"hot",pt.src).map(([nm,fr])=>`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px"><span style="flex:1;min-width:0">${nm}</span><span style="text-align:right;max-width:55%">${fr.map(f=>ttag(f,"margin:0 0 4px 4px")).join("")}</span></div>`).join("")+`</div>`;});
h+=`<div class="sec">Good to know for a family of 4</div>`+t.notes.map(n=>`<div class="rw" style="align-items:flex-start">${ic("info",18)}<span style="font-size:14px;line-height:1.5">${n}</span></div>`).join("");
const lk="flex:1;text-align:center;font-size:14px;padding:10px 8px;border:1px solid var(--line-strong);border-radius:var(--radius);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:5px";
h+=`<div style="display:flex;gap:8px;margin:14px 16px 20px;border-top:1px solid var(--line);padding-top:14px"><a href="https://www.point.me" style="${lk}">Search point.me ${ic("extLink",15)}</a><a href="https://seats.aero" style="${lk}">Search seats.aero ${ic("extLink",15)}</a></div>`;
return h}
function tripFormV(){
const k=V()[1],f=S.form;
let h=hd("Edit trip",true);
h+=fld("n","Destination",f.n,`placeholder="Rome"`);
h+=fld("sub","Subtitle",f.sub,`placeholder="7 nights"`);
h+=`<div style="margin:0 16px 14px"><label class="lb" for="f-notes">Good-to-know notes (one per line)</label><textarea id="f-notes" name="notes">${esc(f.notes)}</textarea></div>`;
h+=`<div class="sec" style="margin-top:6px">Flights</div>`;
h+=fld("fd","Description",f.fd,`placeholder="Boston to Rome, 4 round-trip seats"`);
h+=fld("fneed","Points needed (estimate)",f.fneed,`inputmode="numeric" placeholder="240000"`);
h+=`<div style="margin:0 16px 14px"><div class="lb">Programs that can pay for flights</div>${multiPills("fsrc",Object.keys(P),f.fsrc)}${errH("fsrc")}</div>`;
h+=`<div class="sec">Hotel</div>`;
h+=fld("hd","Description",f.hd,`placeholder="7 nights, 1 family room"`);
h+=fld("hneed","Points needed (estimate)",f.hneed,`inputmode="numeric" placeholder="200000"`);
h+=`<div style="margin:0 16px 14px"><div class="lb">Programs that can pay for the hotel</div>${multiPills("hsrc",Object.keys(P),f.hsrc)}${errH("hsrc")}</div>`;
h+=`<p class="sm" style="margin:0 16px 14px">Ways to pay and airline/hotel partner lists are worked out automatically from the programs you pick here — no rebuild needed to swap in a new destination.</p>`;
h+=`<div style="display:flex;gap:8px;margin:18px 16px 20px;border-top:1px solid var(--line);padding-top:16px">${btn("savetrip","Save trip","tap b1","flex:1")}${btn("back","Cancel","tap b2","flex:1")}</div>`;
return h}
function priceV(){
const v=V(),t=trip(v[1]),pkey=v[2],pt=pkey==="flights"?t.flights:t.hotel,f=S.form;
let h=hd("Real price",true)+`<p class="sm" style="margin:-4px 16px 14px">${t.n} ${(pkey==="flights"?"flights":"hotel").toLowerCase()}: ${pt.d}</p>`;
h+=fld("pts",pkey==="hotel"?"Total points for the whole stay":"Total points for all 4 travelers",f.pts,`inputmode="numeric" placeholder="312000"`);
h+=`<div style="margin:0 16px 14px"><label class="lb" for="f-src">Where you found it</label><select id="f-src" name="src" style="width:100%">${["seats.aero","point.me","Airline website","Hotel website or app"].map(s=>`<option${f.src===s?" selected":""}>${s}</option>`).join("")}</select></div>`;
h+=`<p class="sm" style="margin:0 16px 14px">Today's date is saved with the price, since award prices change daily.</p>`;
h+=`<div style="display:flex;gap:8px;margin:18px 16px 0;border-top:1px solid var(--line);padding-top:16px">${btn("saveprice","Save price","tap b1","flex:1")}${btn("back","Cancel","tap b2","flex:1")}</div>`;
h+=pt.real?`<div style="margin:14px 16px 20px">${btn("clearprice","Go back to the estimate","tap","font-size:14px;color:var(--accent);display:inline-block")}</div>`:`<div style="height:20px"></div>`;
return h}
/* ---------- update balances ---------- */
function upd(){
let h=hd("Update balances",true);
h+=`<p class="sm" style="margin:-4px 16px 12px">Type what each bank or hotel app shows. Saving updates both phones.</p><div class="tc">`;
A.forEach(a=>{const v=S.draft?S.draft[a.k]:a.b;
h+=`<div class="rw" style="flex-wrap:wrap"><span class="dot" style="${dotc(P[a.p].h)}"></span><label for="in-${a.k}" style="flex:1;min-width:0;font-size:14px;line-height:1.4">${ownL(a.o)}'s ${a.l}</label><input id="in-${a.k}" data-k="${a.k}" inputmode="numeric" value="${esc(v)}" style="width:110px;text-align:right"><div id="er-${a.k}" style="width:100%;font-size:13px;color:var(--danger);text-align:right;${S.err[a.k]?"":"display:none"}">Enter a whole number, like 48200</div></div>`;});
h+=`</div><div style="display:flex;gap:8px;margin:16px 16px 20px">${btn("save","Save balances","tap b1","flex:1")}${btn("back","Cancel","tap b2","flex:1")}</div>`;
return h}
/* ---------- render ---------- */
const scr=document.getElementById("scr"),tabs=document.getElementById("tabs"),ph=document.getElementById("ph"),topbar=document.getElementById("topbar");
let spT;
function render(){
if(S.screen==="splash"){scr.innerHTML=splash();tabs.innerHTML="";tabs.style.display="none";topbar.style.display="none";return}
tabs.style.display="flex";topbar.style.display="flex";topbar.innerHTML=topbarH();
const v=V();let h;
if(v){const t=v[0];
h=t==="prog"?prog(v[1]):t==="trip"?tripV(v[1]):t==="edittrip"?tripFormV():t==="card"?cardV(v[1]):t==="close"?closeV(v[1]):t==="cardform"?formV():t==="acct"?acctV():t==="price"?priceV():t==="perk"?perkV(v[1]):t==="alerts"?alertsScreen():upd();}
else h={points,cards,perks,trips}[S.tab]();
scr.innerHTML=(S.toast?`<div style="margin:12px 16px 0;padding:10px 12px;border-radius:var(--radius);background:var(--success-bg);color:var(--success);font-size:14px;display:flex;align-items:center;gap:6px">${ic("check",16)} ${S.toast}</div>`:"")+h;
tabs.innerHTML=[["points","coins","Points"],["cards","card","Cards"],["perks","tag","Perks"],["trips","plane","Trips"]].map(([k,i,l])=>`<button type="button" class="tb${S.tab===k?" on":""}" data-go="tab:${k}">${ic(i,21)}${l}</button>`).join("");
}
function showSplash(){S.screen="splash";render();clearTimeout(spT);spT=setTimeout(()=>{if(S.screen==="splash"){S.screen="app";render()}},2600)}
function newProg(name){const k="x"+(++seq);P[k]={n:name,s:name,h:"green",u:"points",air:[],hot:[],note:"Added by you. Partner details aren't filled in for added programs yet."};return k}
function newPot(p,o,l,b){const k="p"+(++seq);A.push({k,p,o,l,b});return k}
const num=v=>String(v||"").replace(/[$,\s]/g,"");
function saveBal(){
let bad=false;const raw={},vals={};
A.forEach(a=>{const r=document.getElementById("in-"+a.k).value;raw[a.k]=r;const c=num(r);
if(!/^\d+$/.test(c)){S.err[a.k]=1;bad=true}else{delete S.err[a.k];vals[a.k]=parseInt(c,10)}});
if(bad){S.draft=raw;render();return}
A.forEach(a=>{a.b=vals[a.k]});S.days=0;S.draft=null;S.err={};S.stack=[];S.tab="points";S.toast="Balances saved";render();
}
function saveCard(){
const f=S.form,id=V()[1];S.err={};
if(!f.n.trim())S.err.n="Enter a nickname, like Abby's Hyatt card";
const fee=num(f.fee);if(fee&&!/^\d+$/.test(fee))S.err.fee="Enter a whole dollar amount, like 95";
if(!id&&f.p==="new"){if(!f.np.trim())S.err.np="Enter the program name, like World of Hyatt";if(!/^\d+$/.test(num(f.nb)))S.err.nb="Enter a whole number, like 0 or 25000";}
if(Object.keys(S.err).length){render();return}
const feeV=fee===""?null:parseInt(fee,10),moV=f.mo?parseInt(f.mo,10):null;
if(id){const c=card(id);c.n=f.n.trim();c.o=f.o;c.fee=feeV;c.mo=moV;const pt=pot(c.pot);if(pt&&P[c.p].perCard&&!C.some(x=>x.pot===c.pot&&x.id!==c.id)){pt.l=c.n;pt.o=c.o}S.stack.pop();S.toast="Changes saved";render();return}
let pk=f.p,pk2;
if(pk==="new"){pk=newProg(f.np.trim());pk2=newPot(pk,f.o,P[pk].s+" account",parseInt(num(f.nb),10))}
else if(P[pk].perCard)pk2=newPot(pk,f.o,f.n.trim(),0);
else{const ex=A.find(a=>a.p===pk&&(a.o===f.o||a.o==="Both"||f.o==="Both"))||A.find(a=>a.p===pk);pk2=ex?ex.k:newPot(pk,f.o,P[pk].s+" account",0)}
C.push({id:"c"+(++seq),n:f.n.trim(),o:f.o,p:pk,pot:pk2,fee:feeV,mo:moV,dec:""});
S.stack=[];S.tab="cards";S.toast="Card added";render();
}
function saveAcct(){
const f=S.form;S.err={};
if(f.p==="new"&&!f.np.trim())S.err.np="Enter the program name, like British Airways Avios";
if(!/^\d+$/.test(num(f.nb)))S.err.nb="Enter a whole number, like 25000";
if(Object.keys(S.err).length){render();return}
const pk=f.p==="new"?newProg(f.np.trim()):f.p;
newPot(pk,f.o,P[pk].s+" account",parseInt(num(f.nb),10));
S.stack=[];S.tab="points";S.toast="Account added";render();
}
function savePrice(){
const v=V(),t=trip(v[1]),pkey=v[2],pt=pkey==="flights"?t.flights:t.hotel,f=S.form;S.err={};
const p=num(f.pts);if(!/^\d+$/.test(p)||parseInt(p,10)===0){S.err.pts="Enter the total points, like 312000";render();return}
pt.real={pts:parseInt(p,10),src:f.src,date:"Sept 10"};S.stack.pop();S.toast="Price saved";render();
}
function saveTrip(){
const k=V()[1],t=trip(k),f=S.form;S.err={};
if(!f.n.trim())S.err.n="Enter a destination name";
if(!/^\d+$/.test(num(f.fneed))||parseInt(num(f.fneed),10)===0)S.err.fneed="Enter the estimated points needed, like 240000";
if(!/^\d+$/.test(num(f.hneed))||parseInt(num(f.hneed),10)===0)S.err.hneed="Enter the estimated points needed, like 200000";
if(!f.fsrc.length)S.err.fsrc="Pick at least one program for flights";
if(!f.hsrc.length)S.err.hsrc="Pick at least one program for the hotel";
if(Object.keys(S.err).length){render();return}
t.n=f.n.trim();t.sub=f.sub.trim();t.notes=f.notes.split("\n").map(x=>x.trim()).filter(Boolean);
t.flights={d:f.fd.trim(),need:parseInt(num(f.fneed),10),src:f.fsrc.slice()};
t.hotel={d:f.hd.trim(),need:parseInt(num(f.hneed),10),src:f.hsrc.slice()};
S.stack.pop();S.toast="Trip saved";render();
}
function saveRedate(id){
const pk=PK.find(x=>x.id===id),v=document.getElementById("f-redate").value.trim();
const m=v.match(/([A-Za-z]+)\s+(\d{1,2}),?\s+(\d{4})/);
if(!m){S.err.redate="Use a format like Sept 10, 2026";render();return}
const mi=MON.findIndex(x=>x.toLowerCase().startsWith(m[1].slice(0,3).toLowerCase()));
if(mi<1){S.err.redate="Use a format like Sept 10, 2026";render();return}
pk.doneDate=new Date(parseInt(m[3],10),mi-1,parseInt(m[2],10));delete S.err.redate;S.toast="Date updated";render();
}
function go(a,b,c){
if(a==="save"){saveBal();return}
if(a==="savecard"){saveCard();return}
if(a==="saveacct"){saveAcct();return}
if(a==="saveprice"){savePrice();return}
if(a==="savetrip"){saveTrip();return}
if(a==="saveredate"){saveRedate(b);return}
if(a==="fo"){S.form.o=b;render();return}
if(a==="fsrc"){const i=S.form.fsrc.indexOf(b);i>-1?S.form.fsrc.splice(i,1):S.form.fsrc.push(b);render();return}
if(a==="hsrc"){const i=S.form.hsrc.indexOf(b);i>-1?S.form.hsrc.splice(i,1):S.form.hsrc.push(b);render();return}
if(a==="fold"){S.folds[b]=!S.folds[b];render();return}
if(a==="progFromAlert"){progFromAlert(b);return}
S.toast="";
if(a==="open"){S.screen="app";clearTimeout(spT)}
else if(a==="splash"){showSplash();return}
else if(a==="tab"){S.tab=b;S.stack=[]}
else if(a==="prog"||a==="trip"||a==="card"||a==="close"||a==="perk")S.stack.push([a,b]);
else if(a==="openalerts")S.stack.push(["alerts"]);
else if(a==="back"){S.stack.pop();S.err={};S.draft=null}
else if(a==="update"){S.stack.push(["upd"]);S.err={};S.draft=null}
else if(a==="f")S.f=b;
else if(a==="dismiss")S.alerts=S.alerts.filter(x=>x.id!==b);
else if(a==="toggleperk"){const pk=PK.find(x=>x.id===b);if(pk){if(pk.status==="open"){pk.status="done";pk.doneDate=new Date(TODAY)}else{pk.status="open"}}}
else if(a==="addperk")S.toast="In the full app, this opens a form to add a new perk";
else if(a==="addcard"){S.form={n:"",o:"Jess",p:"chase",np:"",nb:"",fee:"",mo:""};S.err={};S.stack.push(["cardform",null])}
else if(a==="editcard"){const x=card(b);S.form={n:x.n,o:x.o,p:x.p,np:"",nb:"",fee:x.fee==null?"":String(x.fee),mo:x.mo?String(x.mo):""};S.err={};S.stack.push(["cardform",b])}
else if(a==="addacct"){S.form={p:"new",np:"",o:"Jess",nb:""};S.err={};S.stack.push(["acct"])}
else if(a==="edittrip"){const t=trip(b);S.form={n:t.n,sub:t.sub,notes:t.notes.join("\n"),fd:t.flights.d,fneed:String(t.flights.need),fsrc:t.flights.src.slice(),hd:t.hotel.d,hneed:String(t.hotel.need),hsrc:t.hotel.src.slice()};S.err={};S.stack.push(["edittrip",b])}
else if(a==="price"){const t=trip(b),pt=c==="flights"?t.flights:t.hotel;S.form={pts:pt.real?String(pt.real.pts):"",src:pt.real?pt.real.src:"seats.aero"};S.err={};S.stack.push(["price",b,c])}
else if(a==="clearprice"){const v=V(),t=trip(v[1]);delete (v[2]==="flights"?t.flights:t.hotel).real;S.stack.pop();S.toast="Back to the estimate"}
else if(a==="dec"){const x=card(b);x.dec=x.dec===c?"":c}
else if(a==="cal")S.toast="In the real app, this adds the fee date to your iPhone calendar";
else if(a==="closecard"){const x=card(b);x.closed="Sept 2026";x.dec="";S.stack=[];S.tab="cards";S.toast="Moved to closed cards"}
else if(a==="delcard"){const i=C.findIndex(x=>x.id===b);if(i>-1)C.splice(i,1);S.stack=[];S.tab="cards";S.toast="Card deleted"}
render();
}
ph.addEventListener("click",e=>{const el=e.target.closest("[data-go]");if(!el)return;const [a,b,c]=el.dataset.go.split(":");go(a,b,c)});
topbar.addEventListener("click",e=>{const el=e.target.closest("[data-go]");if(!el)return;const [a,b,c]=el.dataset.go.split(":");go(a,b,c)});
ph.addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const t=e.target;if(t.tagName==="INPUT"||t.tagName==="SELECT"||t.tagName==="TEXTAREA")return;const el=t.closest("[data-go]");if(!el)return;e.preventDefault();el.click()});
ph.addEventListener("input",e=>{const t=e.target;
if(t.dataset&&t.dataset.k){const k=t.dataset.k;delete S.err[k];const er=document.getElementById("er-"+k);if(er)er.style.display="none";return}
if(t.name&&S.form){S.form[t.name]=t.value;if(S.err[t.name]){delete S.err[t.name];const er=document.getElementById("er-"+t.name);if(er)er.style.display="none"}}});
ph.addEventListener("change",e=>{const t=e.target;if(t.name==="p"&&S.form){S.form.p=t.value;render()}});
showSplash();
</script>
</body>
</html>

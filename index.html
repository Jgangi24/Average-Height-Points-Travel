<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Average Height — Points &amp; Travel</title>
<link rel="icon" href="Assets/iphone-icon.png">
<link rel="apple-touch-icon" href="Assets/iphone-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Points &amp; Travel">
<meta name="theme-color" content="#FFFFFF">
<style>
:root{
  --paper:#EFEDE7; --paper-2:#FFFFFF; --ink:#1E2733; --ink-soft:#5B6169; --ink-muted:#9A9690;
  --line:#DAD6CC; --line-strong:#C7C2B4;
  --accent:#C1592E; --on-accent:#FFFCF6; --accent-wash:#F3E2D9;
  --success:#2F6F4E; --success-bg:#E1EBE3;
  --warning:#96731D; --warning-bg:#F1E8D2;
  --danger:#A23238; --danger-bg:#F3E0DF;
  --radius:12px; --radius-lg:22px;
  --tint-blue-bg:#DCE4EE;   --tint-blue-fg:#2C4D73;
  --tint-aqua-bg:#DCEBE8;   --tint-aqua-fg:#1F7A72;
  --tint-gold-bg:#F1E8D2;   --tint-gold-fg:#8A6A1E;
  --tint-violet-bg:#E7E0EE; --tint-violet-fg:#6B4C93;
  --tint-magenta-bg:#EFE0E8; --tint-magenta-fg:#95396A;
  --tint-green-bg:#E1E9DC;  --tint-green-fg:#4A7A3E;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
h1,h2,h3,.serif{font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:460px;margin:0 auto;padding:28px 14px 48px}
.ph{max-width:390px;height:844px;margin:0 auto;background:var(--paper);border:1px solid var(--line-strong);border-radius:32px;overflow:hidden;box-shadow:0 18px 40px -20px rgba(28,43,57,.35);display:flex;flex-direction:column}
#topbar{flex:none}
#scr{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#tabs{flex:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--paper-2);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);letter-spacing:.01em}
.bellwrap{position:relative;padding:4px}
.bellwrap .dot{position:absolute;top:1px;right:1px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;line-height:15px;text-align:center;font-weight:600}
.tap{cursor:pointer}
.tap:focus-visible,.bk:focus-visible,.tb:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bk{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:15px;cursor:pointer;padding:4px 0;background:none;border:none;font-family:inherit}
.rw{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line)}
.rw.tap:active{background:var(--paper)}
.sm{font-size:13px;color:var(--ink-soft);line-height:1.5}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:999px;margin:0 6px 6px 0}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--paper-2)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 13px;font-size:11.5px;color:var(--ink-soft);cursor:pointer;background:none;border:none;font-family:inherit}
.tb.on{color:var(--accent)}
.tc{margin:0 20px 14px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--paper-2)}
.sec{display:flex;align-items:center;justify-content:space-between;font-size:14.5px;font-weight:600;color:var(--ink);margin:18px 20px 8px;text-transform:none}
.ttl{margin:6px 20px 12px;font-size:23px;font-weight:600;font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
.num{font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
.pill{padding:6px 14px;border-radius:999px;font-size:13px;border:1px solid var(--line-strong);color:var(--ink-soft);background:none;font-family:inherit;cursor:pointer}
.pill.on{background:var(--paper-2);color:var(--accent);border-color:var(--accent);font-weight:600}
.b1{text-align:center;background:var(--accent);color:var(--on-accent);padding:10px 14px;border-radius:var(--radius);font-size:15px;border:none;cursor:pointer;font-family:inherit;width:100%}
.b2{text-align:center;border:1px solid var(--line-strong);padding:10px 14px;border-radius:var(--radius);font-size:15px;background:none;cursor:pointer;font-family:inherit;width:100%;color:var(--ink)}
.lb{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px}
input,select,textarea{font-family:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line-strong);border-radius:10px;background:var(--paper-2);color:var(--ink)}
textarea{width:100%;resize:vertical;min-height:64px}
.foldsec{margin:0 20px 12px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper-2)}
.foldhd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer}
.foldhd .chv{transition:transform .15s ease}
.foldhd.open .chv{transform:rotate(180deg)}
.ic{display:inline-block;vertical-align:-4px}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes wordmark{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:translateY(0)}}
.wm{animation:wordmark .6s ease .9s both}
.frame{position:absolute;inset:0;opacity:0}
.frame.f0{animation:frm0 1.0s steps(1) forwards}
.frame.f1{animation:frm1 1.0s steps(1) forwards}
.frame.f2{animation:frm2 1.0s steps(1) forwards}
.frame.f3{animation:frm3 1.0s steps(1) forwards}
@keyframes frm0{0%{opacity:1}24%{opacity:1}25%{opacity:0}100%{opacity:0}}
@keyframes frm1{0%{opacity:0}24%{opacity:0}25%{opacity:1}49%{opacity:1}50%{opacity:0}100%{opacity:0}}
@keyframes frm2{0%{opacity:0}49%{opacity:0}50%{opacity:1}74%{opacity:1}75%{opacity:0}100%{opacity:0}}
@keyframes frm3{0%{opacity:0}74%{opacity:0}75%{opacity:1}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.frame{animation:none!important;opacity:0}.frame.f3{opacity:1}.wm{animation:none;opacity:1}}
</style>
<style>
/* Real-app overrides: fill the actual device viewport instead of the
   fixed-size phone bezel the mockup used for desktop previewing. */
body{overflow:hidden}
.ph{height:100vh;height:100dvh;max-width:600px;margin:0 auto;border:none;border-radius:0;box-shadow:none}
/* iOS 26+/27 standalone web apps get a system blur band painted over the
   top ~35pt of the screen that can't be turned off via meta tags. Push the
   topbar content down clear of that band instead, the way native apps'
   nav bars sit below the status bar with room to spare. */
#topbar{padding-top:30px}
/* Floating rounded nav bar instead of a flat, edge-to-edge docked strip.
   Scoped to phone widths so it can't touch the desktop top-nav layout below. */
@media (max-width:879px){
  .ph{position:relative}
  #scr{padding-bottom:96px}
  #tabs{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:5}
  .tabs{width:fit-content;margin:0;padding:0 8px;gap:2px;border:none;border-radius:26px;overflow:hidden;background:rgba(250,249,247,.7);backdrop-filter:blur(10px) saturate(180%);-webkit-backdrop-filter:blur(10px) saturate(180%);box-shadow:0 14px 32px -18px rgba(28,39,51,.35)}
  .tabs .tb{flex:none;padding:9px 24px 13px}
}
/* Wide-screen shell: instead of the phone frame stretching edge to edge,
   it becomes a contained card (bordered, rounded, shadowed, auto height)
   that floats on the page background -- so the header/nav and the content
   share one visible boundary instead of the nav bleeding wider than the
   content beneath it. Scoped to .app-shell (added once actually inside the
   app, via a class toggled on both #ph and body) so login/splash keep
   their original narrow, fixed-height, edge-to-edge look at any window size. */
@media (min-width:880px){
  body.app-shell{overflow-y:auto}
  .ph.app-shell{
    max-width:1100px;height:auto;margin:32px auto 48px;
    border:1px solid var(--line-strong);border-radius:20px;
    box-shadow:0 24px 50px -28px rgba(28,39,51,.35);
    display:grid;grid-template-columns:1fr;grid-template-rows:auto auto auto;
    grid-template-areas:"topbar" "tabsrow" "main"
  }
  .ph.app-shell #topbar{grid-area:topbar}
  .ph.app-shell #scr{grid-area:main;max-width:860px;margin:0 auto;width:100%;padding-bottom:12px}
  .ph.app-shell #tabs{grid-area:tabsrow}
  .ph.app-shell .tabs{flex-direction:row;justify-content:space-between;max-width:860px;margin:0 auto;border-top:none;border-bottom:1px solid var(--line);padding:10px 20px;gap:6px;align-items:center}
  .ph.app-shell .tb{flex:none;flex-direction:row;justify-content:center;gap:8px;padding:8px 18px;border-radius:999px;font-size:14px}
  .ph.app-shell .tb.on{background:var(--accent-wash)}
  .trips-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  .trips-grid .tc{margin:0}
}
</style>
</head>

function nextDateForMonth(month){
  const now=new Date();let year=now.getFullYear();

}
function nextDateForDay(day){
  const now=new Date();let year=now.getFullYear(),month=now.getMonth();
  if(day<=now.getDate()){month++;if(month>11){month=0;year++}}

  return new Date(year,month,Math.min(day,daysInMonth));

async function saveCard(){
  const f=S.form,id=stackTop()[1];S.err={};
  const name=(f.n||"").trim();
  if(!name)S.err.n="Enter a nickname, like Abby's Hyatt card";
  const feeRaw=num(f.fee);
  if(feeRaw&&!/^\d+$/.test(feeRaw))S.err.fee="Enter a whole dollar amount, like 95";
  const dueRaw=num(f.due);
  if(dueRaw&&(!/^\d+$/.test(dueRaw)||+dueRaw<1||+dueRaw>31))S.err.due="Enter a day between 1 and 31";
  if(!id){
    if(f.p==="new"&&!(f.np||"").trim())S.err.np="Enter the program name, like World of Hyatt";
    if((f.p==="new"||f.pot==="new")&&!/^\d+$/.test(num(f.nb||"0")))S.err.nb="Enter a whole number, like 0 or 25000";
    if(f.p&&f.p!=="new"&&!f.pot)S.err.pot="Choose a pot for this card";
  }
  if(Object.keys(S.err).length){render();return}
  const feeV=feeRaw===""?null:parseInt(feeRaw,10);
  const moV=f.mo?parseInt(f.mo,10):null;
  const dueV=dueRaw===""?null:parseInt(dueRaw,10);
  if(id){
    const {error}=await sb.from("cards").update({name,owner:f.o,annual_fee:feeV,fee_month:moV,bill_due_day:dueV}).eq("id",id);
    if(error){S.err.n=error.message;render();return}
    await loadData();S.stack.pop();S.toast="Changes saved";render();return;
  }
  let programId=f.p;
  if(programId==="new"){
    const {data:np,error}=await sb.from("programs").insert({name:f.np.trim(),short_name:f.np.trim(),unit:"points"}).select().single();
    if(error){S.err.np=error.message;render();return}
    programId=np.id;
  }
  let potId=f.pot;
  const needNewPot=f.p==="new"||f.pot==="new";
  if(needNewPot){
    const {data:npot,error}=await sb.from("points_pots").insert({program_id:programId,owner:f.o,label:name,balance:parseInt(num(f.nb||"0"),10)}).select().single();
    if(error){S.err.nb=error.message;render();return}
    potId=npot.id;
  }
  const {error:cardErr}=await sb.from("cards").insert({name,owner:f.o,program_id:programId,pot_id:potId,annual_fee:feeV,fee_month:moV,bill_due_day:dueV});
  if(cardErr){S.err.n=cardErr.message;render();return}
  await loadData();S.stack=[];S.tab="cards";S.toast="Card added";render();
}

  let programId=f.p;
  if(programId==="new"){
    const {data:np,error}=await sb.from("programs").insert({name:f.np.trim(),short_name:f.np.trim(),unit:"points"}).select().single();
    if(error){S.err.np=error.message;render();return}
    programId=np.id;
  }
  const pr=program(programId);
  const {error}=await sb.from("points_pots").insert({program_id:programId,owner:f.o,label:(pr?pr.short_name:f.np.trim()),balance:parseInt(num(f.nb),10)});
  if(error){S.err.nb=error.message;render();return}
  await loadData();S.stack=[];S.tab="points";S.toast="Account added";render();
}
async function saveTrip(){
  const tripId=stackTop()[1],f=S.form;S.err={};
  const destination=(f.n||"").trim();
  if(!destination)S.err.n="Enter a destination name";
  const fneedRaw=num(f.fneed);
  if(!/^\d+$/.test(fneedRaw)||fneedRaw==="0")S.err.fneed="Enter the estimated points needed, like 240000";
  const hneedRaw=num(f.hneed);
  if(!/^\d+$/.test(hneedRaw)||hneedRaw==="0")S.err.hneed="Enter the estimated points needed, like 200000";
  if(!f.fsrc.length)S.err.fsrc="Pick at least one program for flights";
  if(!f.hsrc.length)S.err.hsrc="Pick at least one program for the hotel";
  if(Object.keys(S.err).length){render();return}
  const notes=(f.notes||"").split("\n").map(x=>x.trim()).filter(Boolean);
  const {error:e1}=await sb.from("trips").update({destination,subtitle:(f.sub||"").trim()||null,notes}).eq("id",tripId);
  if(e1){S.err.n=e1.message;render();return}
  const {error:e2}=await sb.from("trip_legs").update({description:(f.fd||"").trim(),points_estimate:parseInt(fneedRaw,10),source_program_ids:f.fsrc}).eq("trip_id",tripId).eq("kind","flights");
  if(e2){S.err.fneed=e2.message;render();return}
  const {error:e3}=await sb.from("trip_legs").update({description:(f.hd||"").trim(),points_estimate:parseInt(hneedRaw,10),source_program_ids:f.hsrc}).eq("trip_id",tripId).eq("kind","hotel");
  if(e3){S.err.hneed=e3.message;render();return}
  await loadData();S.stack.pop();S.toast="Trip saved";render();
}
async function savePrice(){
  const v=stackTop(),tripId=v[1],kind=v[2],f=S.form;S.err={};
  const ptsRaw=num(f.pts);
  if(!/^\d+$/.test(ptsRaw)||ptsRaw==="0"){S.err.pts="Enter the total points, like 312000";render();return}
  const {error}=await sb.from("trip_legs").update({real_points:parseInt(ptsRaw,10),real_source:f.src,real_price_date:todayStr()}).eq("trip_id",tripId).eq("kind",kind);
  if(error){S.err.pts=error.message;render();return}
  await loadData();S.stack.pop();S.toast="Price saved";render();
}
async function clearPrice(){
  const v=stackTop(),tripId=v[1],kind=v[2];
  const {error}=await sb.from("trip_legs").update({real_points:null,real_source:null,real_price_date:null}).eq("trip_id",tripId).eq("kind",kind);
  if(error){S.toast="Couldn't clear the price";render();return}
  await loadData();S.stack.pop();S.toast="Back to the estimate";render();
}
async function saveBalances(){
  let bad=false;const vals={};
  S.data.pots.forEach(p=>{
    const el=document.getElementById("in-"+p.id);if(!el)return;
    const c=num(el.value);
    if(!/^\d+$/.test(c)){S.err[p.id]=1;bad=true}else{delete S.err[p.id];vals[p.id]=parseInt(c,10)}
  });
  if(bad){render();return}
  const now=new Date().toISOString();
  await Promise.all(Object.entries(vals).map(([id,balance])=>sb.from("points_pots").update({balance,updated_at:now}).eq("id",id)));
  await loadData();S.err={};S.stack=[];S.tab="points";S.toast="Balances saved";render();
}
/* ---------- render ---------- */
const scr=document.getElementById("scr"),tabsEl=document.getElementById("tabs"),ph=document.getElementById("ph"),topbar=document.getElementById("topbar");
function render(){
  ph.classList.toggle("app-shell",S.screen==="app");
  document.body.classList.toggle("app-shell",S.screen==="app");
  if(S.screen==="splash"){topbar.style.display="none";tabsEl.style.display="none";tabsEl.innerHTML="";scr.innerHTML=splashScreen();return}
  if(S.screen==="loading"){topbar.style.display="none";tabsEl.style.display="none";tabsEl.innerHTML="";scr.innerHTML=`<p style="padding:2rem 1rem;color:var(--ink-soft);font-size:14px;margin:0">Loading…</p>`;return}
  if(S.screen==="login"){topbar.style.display="none";tabsEl.style.display="none";tabsEl.innerHTML="";scr.innerHTML=loginScreen();return}
  topbar.style.display="flex";tabsEl.style.display="flex";topbar.innerHTML=topbarH();
  const v=stackTop();let h;
  if(v){const t=v[0];
    h=t==="prog"?progScreen(v[1]):t==="card"?cardDetailScreen(v[1]):t==="close"?closeCardScreen(v[1]):t==="cardform"?cardFormScreen():t==="acct"?acctScreen():t==="upd"?updScreen():t==="alerts"?alertsScreen():t==="perk"?perkDetailScreen(v[1]):t==="perkform"?perkFormScreen():t==="trip"?tripDetailScreen(v[1]):t==="edittrip"?tripFormScreen():t==="price"?priceFormScreen():"";
  }else{
    h=S.tab==="points"?pointsScreen():S.tab==="cards"?cardsScreen():S.tab==="perks"?perksScreen():tripsScreen();
  }
  const errBanner=S.loadError?box("--danger-bg","--danger","Couldn't load data: "+esc(S.loadError)):"";
  const toastBanner=S.toast?`<div style="margin:12px 20px 0;padding:10px 12px;border-radius:var(--radius);background:var(--success-bg);color:var(--success);font-size:14px;display:flex;align-items:center;gap:6px">${ic("check",16)} ${esc(S.toast)}</div>`:"";
  scr.innerHTML=errBanner+toastBanner+h;
  scr.scrollTop=0;
  tabsEl.innerHTML=[["points","coins","Points"],["cards","card","Cards"],["perks","tag","Perks"],["trips","plane","Trips"]].map(([k,i,l])=>`<button type="button" class="tb${S.tab===k?" on":""}" data-go="tab:${k}">${ic(i,21)}${l}</button>`).join("");
}
/* ---------- router ---------- */
async function go(a,b,c){
  S.toast="";
  if(a==="open"){skipSplash();return}
  if(a==="signin"){await doSignIn();return}
  if(a==="signout"){await doSignOut();return}
  if(a==="fo"){S.form.o=b;render();return}
  if(a==="dec"){const x=card(b);const val=x.decision_note===c?null:c;await sb.from("cards").update({decision_note:val}).eq("id",b);await loadData();render();return}
  if(a==="tab"){S.tab=b;S.stack=[];render();return}
  if(a==="prog"){S.stack.push(["prog",b]);render();return}
  if(a==="card"){S.stack.push(["card",b]);render();return}
  if(a==="close"){S.stack.push(["close",b]);render();return}
  if(a==="back"){S.stack.pop();S.err={};render();return}
  if(a==="addcard"){const defProg=orderedPrograms()[0];S.form={n:"",o:"Jess",p:defProg?defProg.id:"new",pot:"new",np:"",nb:"",fee:"",mo:"",due:""};S.err={};S.stack.push(["cardform",null]);render();return}
  if(a==="editcard"){const x=card(b);S.form={n:x.name,o:x.owner,fee:x.annual_fee==null?"":String(x.annual_fee),mo:x.fee_month?String(x.fee_month):"",due:x.bill_due_day?String(x.bill_due_day):""};S.err={};S.stack.push(["cardform",b]);render();return}
  if(a==="savecard"){await saveCard();return}
  if(a==="addacct"){const defProg=orderedPrograms()[0];S.form={p:defProg?defProg.id:"new",np:"",o:"Jess",nb:""};S.err={};S.stack.push(["acct"]);render();return}
  if(a==="saveacct"){await saveAcct();return}
  if(a==="update"){S.stack.push(["upd"]);S.err={};render();return}
  if(a==="save"){await saveBalances();return}
  if(a==="f"){S.f=b;render();return}
  if(a==="closecard"){await sb.from("cards").update({status:"closed",closed_at:new Date().toISOString()}).eq("id",b);await loadData();S.stack=[];S.tab="cards";S.toast="Moved to closed cards";render();return}
  if(a==="delcard"){const x=card(b);if(!window.confirm(`Delete "${x?x.name:"this card"}" completely? This can't be undone.`)){return}await sb.from("cards").delete().eq("id",b);await loadData();S.stack=[];S.tab="cards";S.toast="Card deleted";render();return}
  if(a==="openalerts"){S.stack.push(["alerts"]);render();return}
  if(a==="progFromAlert"){S.stack=[["prog",b]];render();return}
  if(a==="dismissalert"){await sb.from("alerts").delete().eq("id",b);await loadData();render();return}
  if(a==="cal"){
    const x=card(b);
    window.open(gcalLink({title:`${x.name} annual fee ($${fmt(x.annual_fee)})`,start:nextDateForMonth(x.fee_month),recurRule:"FREQ=YEARLY",details:"Average Height Points & Travel — annual fee reminder."}),"_blank","noopener");
    return;
  }
  if(a==="caldue"){
    const x=card(b);
    window.open(gcalLink({title:`${x.name} bill due`,start:nextDateForDay(x.bill_due_day),recurRule:"FREQ=MONTHLY",details:"Average Height Points & Travel — monthly bill due reminder."}),"_blank","noopener");
    return;
  }
  if(a==="fold"){S.folds[b]=!S.folds[b];render();return}
  if(a==="perk"){S.stack.push(["perk",b]);render();return}
  if(a==="toggleperk"){
    const pk=S.data.perks.find(x=>x.id===b);
    if(pk&&perkStatus(pk)==="open"){await sb.from("perk_redemptions").insert({perk_id:b,redeemed_on:todayStr()});await loadData()}
    render();return;
  }
  if(a==="undoperk"){
    const pk=S.data.perks.find(x=>x.id===b);
    const red=pk?currentRedemption(pk):null;
    if(red)await sb.from("perk_redemptions").delete().eq("id",red.id);
    await loadData();S.stack.pop();render();return;
  }
  if(a==="saveredate"){
    const pk=S.data.perks.find(x=>x.id===b);
    const red=pk?currentRedemption(pk):null;
    const iso=parseDateInput(document.getElementById("f-redate").value);
    if(!iso){S.err.redate="Use a format like Sept 10, 2026";render();return}
    if(red)await sb.from("perk_redemptions").update({redeemed_on:iso}).eq("id",red.id);
    await loadData();delete S.err.redate;S.toast="Date updated";render();return;
  }
  if(a==="addperk"){S.form={name:"",value:"",cad:"monthly",windowEnd:"",startsOn:"",note:""};S.err={};S.stack.push(["perkform",null,b]);render();return}
  if(a==="editperk"){
    const pk=S.data.perks.find(x=>x.id===b);
    S.form={name:pk.name,value:String(pk.value),cad:pk.cadence,windowEnd:pk.window_end?fmtDate(pk.window_end):"",startsOn:pk.starts_on?fmtDate(pk.starts_on):"",note:pk.note||""};
    S.err={};S.stack.push(["perkform",b,pk.card_id]);render();return;
  }
  if(a==="saveperk"){await savePerk();return}
  if(a==="trip"){S.stack.push(["trip",b]);render();return}
  if(a==="edittrip"){
    const t=S.data.trips.find(x=>x.id===b),fl=legFor(b,"flights"),ho=legFor(b,"hotel");
    S.form={n:t.destination,sub:t.subtitle||"",notes:(t.notes||[]).join("\n"),
      fd:fl?fl.description:"",fneed:fl?String(fl.points_estimate):"",fsrc:fl?fl.source_program_ids.slice():[],
      hd:ho?ho.description:"",hneed:ho?String(ho.points_estimate):"",hsrc:ho?ho.source_program_ids.slice():[]};
    S.err={};S.stack.push(["edittrip",b]);render();return;
  }
  if(a==="savetrip"){await saveTrip();return}
  if(a==="fsrc"){const i=S.form.fsrc.indexOf(b);i>-1?S.form.fsrc.splice(i,1):S.form.fsrc.push(b);render();return}
  if(a==="hsrc"){const i=S.form.hsrc.indexOf(b);i>-1?S.form.hsrc.splice(i,1):S.form.hsrc.push(b);render();return}
  if(a==="price"){
    const leg=legFor(b,c);
    S.form={pts:leg&&leg.real_points!=null?String(leg.real_points):"",src:leg&&leg.real_source?leg.real_source:"seats.aero"};
    S.err={};S.stack.push(["price",b,c]);render();return;
  }
  if(a==="saveprice"){await savePrice();return}
  if(a==="clearprice"){await clearPrice();return}
  if(a==="delperk"){
    const pk=S.data.perks.find(x=>x.id===b);const cardId=pk?pk.card_id:null;
    if(!window.confirm("Delete this perk? Its history will be deleted too.")){return}
    await sb.from("perks").delete().eq("id",b);await loadData();
    S.stack=cardId?[["card",cardId]]:[];S.toast="Perk deleted";render();return;
  }
  render();
}
/* ---------- events ---------- */
ph.addEventListener("click",e=>{const el=e.target.closest("[data-go]");if(!el)return;if(e.detail>0&&el.blur)el.blur();const [a,b,c]=el.dataset.go.split(":");go(a,b,c)});
topbar.addEventListener("click",e=>{const el=e.target.closest("[data-go]");if(!el)return;if(e.detail>0&&el.blur)el.blur();const [a,b,c]=el.dataset.go.split(":");go(a,b,c)});
ph.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target&&e.target.id==="f-password"){go("signin");return}
  if(e.key!=="Enter"&&e.key!==" ")return;
  const t=e.target;if(t.tagName==="INPUT"||t.tagName==="SELECT"||t.tagName==="TEXTAREA")return;
  const el=t.closest("[data-go]");if(!el)return;e.preventDefault();el.click();
});
ph.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.k){const k=t.dataset.k;delete S.err[k];const er=document.getElementById("er-"+k);if(er)er.style.display="none";return}
  if((t.name==="email"||t.name==="password")&&S.screen==="login"){S.form=S.form||{};S.form[t.name]=t.value;return}
  if(t.name&&S.form){S.form[t.name]=t.value;if(S.err[t.name]){delete S.err[t.name];const er=document.getElementById("er-"+t.name);if(er)er.style.display="none"}}
});
ph.addEventListener("change",e=>{
  const t=e.target;
  if(t.name==="p"&&S.form){S.form.p=t.value;S.form.pot="";render()}
  else if(t.name==="pot"&&S.form){S.form.pot=t.value;render()}
});
/* ---------- init ---------- */
// The splash plays for a minimum of 2.6s (matching the approved mockup
// timing) while the session check runs in the background; whichever
// finishes last decides when the login/app screen actually appears. A tap
// on the splash (skipSplash, wired to the "open" action above) skips the
// remaining wait but still waits for the session check if it's still in
// flight, so there's no gap where the wrong screen flashes.
let skipSplash=()=>{};
function beginSplash(){
  let minWaitDone=false,authDone=false,hasSession=false;
  const tid=setTimeout(()=>{minWaitDone=true;maybeAdvance()},2600);
  sb.auth.getSession().then(({data})=>{hasSession=!!data.session;authDone=true;maybeAdvance()});
  async function maybeAdvance(){
    if(S.screen!=="splash"||!minWaitDone||!authDone)return;
    clearTimeout(tid);skipSplash=()=>{};
    if(hasSession){await afterLogin()}else{S.screen="login";render()}
  }
  skipSplash=()=>{minWaitDone=true;maybeAdvance()};
}
beginSplash();
render();
</script>
